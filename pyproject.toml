[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-jwt-audit"
version = "1.3.0"
description = "JWT security auditor — alg=none, RS256-to-HS256 confusion, HMAC brute force, kid/jku injection"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.8"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["jwt", "json-web-token", "security", "audit", "pentest", "web-security", "authentication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["rich>=13.7.0"]

[project.optional-dependencies]
rs256 = ["cryptography>=41.0"]

[project.scripts]
vamp-jwt-audit = "vamp_jwt_audit:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-jwt-audit"
Repository = "https://github.com/Vampsecure-Labs/vamp-jwt-audit"

[tool.setuptools]
py-modules = ["vamp_jwt_audit", "vampsec_report"]
